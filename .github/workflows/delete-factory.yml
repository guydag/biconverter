name: Delete one factory (temporary)
on:
  workflow_dispatch:
    inputs:
      name:
        description: "Factory document name"
        required: true
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --prefix scripts --no-audit --no-fund
      - run: node scripts/delete-factory.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FACTORY_NAME: ${{ github.event.inputs.name }}
